AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  ProofPlate - serverless food-portion learning. CloudFront + private S3 for the
  web app, API Gateway HTTP API + Lambda for inference, DynamoDB for durable
  pilot records, Cognito for operators. No always-on compute.

Parameters:
  Stage:
    Type: String
    Default: prod
  Revision:
    Type: String
    Default: dev
  WithCloudFront:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false on accounts that cannot create CloudFront distributions yet; the Lambda then serves the web app.

Conditions:
  UseCloudFront: !Equals [!Ref WithCloudFront, "true"]

Globals:
  Function:
    Tags:
      Project: proofplate
      Stage: !Ref Stage

Resources:
  # ---------------------------------------------------------------- data
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain          # pilot records survive stack updates and teardown
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - { Key: Project, Value: proofplate }
        - { Key: Stage, Value: !Ref Stage }

  # ---------------------------------------------------------------- identity
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "proofplate-${Stage}-operators"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true       # no public sign-up: operators are invited
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      UserPoolTags:
        Project: proofplate

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: proofplate-web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }

  # ---------------------------------------------------------------- API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20
      Auth:
        Authorizers:
          Operators:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience: [!Ref UserPoolClient]
      Tags:
        Project: proofplate

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: ProofPlate inference and records API (FastAPI on Lambda)
      CodeUri: ../build/lambda
      Handler: proofplate.lambda_handler.handler
      Runtime: python3.13
      Architectures: [x86_64]
      MemorySize: 1536
      Timeout: 25
      Environment:
        Variables:
          PROOFPLATE_ENV: aws
          PROOFPLATE_AUTH: cognito
          PROOFPLATE_STORE: dynamo
          PROOFPLATE_TABLE: !Ref Table
          PROOFPLATE_USER_POOL_ID: !Ref UserPool
          PROOFPLATE_USER_POOL_CLIENT_ID: !Ref UserPoolClient
          PROOFPLATE_REVISION: !Ref Revision
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource: !GetAtt Table.Arn
      Events:
        Pilot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/pilot/{op}
            Method: POST
            Auth:
              Authorizer: Operators
        Public:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: GET

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApiFunction}"
      RetentionInDays: 14

  # ---------------------------------------------------------------- web
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      Tags:
        - { Key: Project, Value: proofplate }

  WebOac:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: UseCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "proofplate-${Stage}-${AWS::Region}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRewrite:
    Type: AWS::CloudFront::Function
    Condition: UseCloudFront
    Properties:
      Name: !Sub "proofplate-${Stage}-spa-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Send extension-less paths to the app shell; leave asset requests alone so a missing file is a real error
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var last = request.uri.split('/').pop();
          if (last.indexOf('.') === -1) { request.uri = '/index.html'; }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "ProofPlate ${Stage}"
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOac.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewrite.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
      Tags:
        - { Key: Project, Value: proofplate }

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: UseCloudFront
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  AppUrl:
    Description: Public HTTPS address of the app
    Value: !If [UseCloudFront, !Sub "https://${Distribution.DomainName}", !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"]
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  DistributionId:
    Value: !If [UseCloudFront, !Ref Distribution, "none"]
  WebBucketName:
    Value: !Ref WebBucket
  TableName:
    Value: !Ref Table
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  FunctionName:
    Value: !Ref ApiFunction
